<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <div id="app">
      <header id="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">🛡️</span>

            <h1 id="ui-title"></h1>
            <p id="ui-subtitle"></p>

      <main id="main">

      <nav id="tabbar" aria-label="Main">
        <button type="button" class="tab" data-tab="home">
          <span class="tab-icon" aria-hidden="true">🏠</span><span class="tab-label" id="tab-home-label"></span>

        <button type="button" class="tab" data-tab="quiz">

          <span class="tab-dot" id="result-dot" hidden aria-hidden="true"></span>

    </div>
